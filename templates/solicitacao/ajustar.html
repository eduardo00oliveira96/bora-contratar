{% extends "admin_base.html" %}
{% block title %}Ajustar Solicitação | Bora Contratar{% endblock %}

{% block content %}
<div class="mb-6">
    <a href="{{ url_for('solicitacao.detalhes', id=vaga.id) }}"
        class="text-brand-600 hover:text-brand-700 font-medium flex items-center">
        <i class="fa-solid fa-arrow-left mr-2"></i> Voltar para detalhes
    </a>
</div>

<div class="max-w-3xl mx-auto">
    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-8 transition-colors">
        <div class="mb-6 border-b border-slate-100 dark:border-slate-700 pb-6">
            <h1 class="text-2xl font-extrabold text-slate-900 dark:text-white">Ajustar Solicitação</h1>
            <p class="text-slate-500 dark:text-slate-400 mt-1">{{ vaga.titulo }}</p>
        </div>

        {% if vaga.observacoes_rh %}
        <div class="mb-6 p-4 bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800 rounded-xl">
            <div class="flex items-start gap-3">
                <i class="fa-solid fa-pen-to-square text-amber-600 dark:text-amber-400 mt-0.5"></i>
                <div>
                    <p class="text-sm font-semibold text-amber-800 dark:text-amber-300">O que o RH solicitou:</p>
                    <p class="text-sm text-amber-700 dark:text-amber-400 mt-1">{{ vaga.observacoes_rh }}</p>
                </div>
            </div>
        </div>
        {% endif %}

        <form method="POST" class="space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div>
                <label for="justificativa" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Justificativa da Necessidade *</label>
                <textarea id="justificativa" name="justificativa" rows="4" required
                    class="w-full px-4 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-900 text-slate-900 dark:text-white focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all"
                    placeholder="Explique por que esta contratação é necessária...">{{ vaga.justificativa or '' }}</textarea>
            </div>

            <div>
                <label for="previsao_inicio" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Previsão de Início</label>
                <input type="date" id="previsao_inicio" name="previsao_inicio" value="{{ vaga.previsao_inicio or '' }}"
                    class="w-full px-4 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-900 text-slate-900 dark:text-white focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all">
            </div>

            <div class="pt-6 border-t border-slate-100 dark:border-slate-700 flex justify-end gap-3">
                <a href="{{ url_for('solicitacao.detalhes', id=vaga.id) }}"
                    class="bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 font-medium py-2.5 px-6 rounded-lg transition-colors">
                    Cancelar
                </a>
                <button type="submit"
                    class="bg-brand-600 hover:bg-brand-700 text-white font-medium py-2.5 px-8 rounded-lg shadow-sm transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i> Reenviar para RH
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
